name: Ошибка
description: Помочь воспроизвести и исправить проблему
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Перед отправкой проверьте docs/FAQ.md. Не прикладывайте пароли, конфиги, приватные сертификаты и данные вашей сети. Об уязвимостях сообщайте через Security → Report a vulnerability.
  - type: input
    id: versions
    attributes:
      label: Версии и устройство
      description: MFC, Android, RouterOS и модель телефона; модель USB-адаптера, если он используется.
      placeholder: MFC 0.2.11, Android …, RouterOS 7.…, телефон …
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Протокол
      options:
        - REST / HTTPS
        - REST / HTTP
        - API
        - API-SSL
        - Не относится к подключению
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Маршрут
      options:
        - Wi-Fi напрямую
        - Системная сеть / VPN
        - Ethernet
        - Не относится к подключению
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. Открыть …\n2. Нажать …\n3. Получить …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
      description: Если менялись правила, отдельно укажите, что показывает сам роутер; не прикладывайте полный конфиг.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Текст ошибки или снимок
      description: Скройте имена объектов, логины, адреса, пароли и прочие личные данные.
